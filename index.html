<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entegris Sentry QCIII Part Number Selector</title>

<style>
body{font-family:Segoe UI;margin:0;background:#eef3f8;}

.header{
  background:#002B5C;color:white;
  padding:15px 20px;font-size:18px;font-weight:bold;
}

.tabs{
    display:flex;
    gap:10px;
    padding:8px;
    background:#ddd;
}

.tab{
    padding:12px 25px;
    cursor:pointer;
    border-radius:6px;
    background:#f2f2f2;
    color:#666;
    font-weight:600;
    transition:all .2s ease;
}

.tab:hover{
    background:#e8e8e8;
}

.tab.active{
    background:#44ae6d;
    color:white;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

.container{max-width:1200px;margin:25px auto;display:flex;gap:25px;}

.card{
  flex:1;background:white;padding:25px;border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.row{margin-bottom:18px;}
label{display:block;font-weight:600;margin-bottom:8px;}

select{
  width:100%;
  padding:10px;
  border-radius:6px;border:1px solid #ccc;
}

.output{font-size:20px;font-weight:bold;margin-bottom:10px;}
.status{font-weight:bold;}

.valid{color:green;}
.warn{color:orange;}
.invalid{color:red;}
</style>
</head>

<body>

<div class="header">
Entegris Sentry QCIII Part Number Selector
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab(0)">Drum Insert</div>
<div class="tab" onclick="switchTab(1)">Dispense Head</div>
</div>

<div class="container">

<div class="card">
<h3>Specification</h3>
<div id="selector"></div>
</div>

<div class="card">
<h3>Result</h3>

<div id="output" class="output">-</div>

<div id="status"></div>

<button
    id="copyBtn"
    onclick="copyPN()"
    style="margin-top:10px;">
    Copy
</button>

<hr>

<div id="headRecommend"
     style="margin-top:10px;
            color:#000000;
            font-weight:600;">
</div>

</div>

<script>

let mode=0;
let dt3pApplied = false;

/* ================= Drum Insert ================= */
const drum=[
["Pipe material",[
['','-- Select --'],
['DI3T','DI3T- PFA (Chaska plant)'],
['DI3Y','DI3Y- PE (Chaska plant, TNPP-free)'],
['DT3P','DT3P- PE (KSP Plant, TNPP-free)']
]],
["Number of ports",[['','-- Select --'],['3','3-ports (No recirculation port)'],['4','4-ports (With recirculation port)']]],
["Length code",[
['','-- Select --'],['01','For 55G composite drum'],['02','For 30G composite drum'],['03','For 15G composite drum'],
['25','For PG1 XF/XG drum'],['29','For TW KSP T2/T8 drum'],['29','For KR JangAn K1/K2/K7/K8 drum'],['29','For Chaska standard size drum'],['XX','Contact Entegris']
]],
["Chemical keycode",[
['','-- Select --'],
['01','01-Nitric acid / Red'],
    ['02','02-Sulfuric acid / Yellow'],
    ['03','03-Ammonia / Green'],
    ['04','04-Acetic acid / Brown'],
    ['05','05-Hydrochloric acid / Blue'],
    ['06','06-Hydrofluoric acid'],
    ['07','07-Ammonium fluoride'],
    ['08','08-Phosphoric acid'],
    ['09','09-Hydrogen peroxide'],
    ['10','10-Acetone'],
    ['11','11-Methanol'],
    ['12','12-Methyl isobutyl ketone'],
    ['13','13-Isopropyl alcohol'],
    ['99','99-Uncoded'],
    ['XX','Contact Entegris']
]],
["Shipping Cap",[     ['','-- Select --'],['0','Standard'],
    ['3','Manual relief'],
    ['6','Vented (H2O2)'] ]],
["O-ring material for shipping cap",[ ['','-- Select --'],['0','FEP-encapsulated Silicone'],['1','FEP-encapsulated FKM'],['2','FEP-encapsulated EPDM'] ]],
["DI Tracking Tag",[ ['','-- Select --'],['0','With serial number tag'],['1','No tag'] ]],
["Special Instructions",[ ['','-- Select --'],['00','Standard angle cut on downtube'],['01','No angle cut on downtube'] ]]
];

/* ================= Dispense Head ================= */
const head=[
["Number of ports",[['','-- Select --'],['DH33','3-ports (No recirculation port)'],['DH34','4-ports (With recirculation port)']]],
["Chemical keycode",[['','-- Select --'],
    ['01','01-Nitric acid'],
    ['02','02-Sulfuric acid'],
    ['03','03-Ammonia'],
    ['04','04-Acetic acid'],
    ['05','05-Hydrochloric acid'],
    ['06','06-Hydrofluoric acid'],
    ['07','07-Ammonium fluoride'],
    ['08','08-Phosphoric acid'],
    ['09','09-Hydrogen peroxide'],
    ['10','10-Acetone'],
    ['11','11-Methanol'],
    ['12','12-Methyl isobutyl ketone'],
    ['13','13-Isopropyl alcohol'],
    ['99','99-Universal'],
    ['XX','Contact Entegris']
]],
["O-ring material",[ ['','-- Select --'],['0','FEP-encapsulated Silicone'],['1','FEP-encapsulated FKM'],['2','FEP-encapsulated EPDM'] ]],
["Nut material",[ ['','-- Select --'],['1','PVDF'],['3','PFA'],['6','CPFA'] ]],
["Special Instructions",[ ['','-- Select --'],['00','Standard'],['01','Dispense port without check valve'],['02','Recirculation port without check valve'],['03','No check valve in either dispense port or recirculation port'] ]]
];

function switchTab(m){
  mode=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i==m));
  render();
}

/* UI render */
function render(){
  let data=mode==0?drum:head;
  let html='';

  data.forEach((d,i)=>{
    html+=`<div class='row'>
      <label>${d[0]}</label>
      <select id='S${i}'></select>
    </div>`;
  });

  document.getElementById('selector').innerHTML=html;
  data.forEach((d,i)=>fill(`S${i}`,d[1]));

  update(); // ✅ 初始化就算一次
}

function fill(id,opts){
  let s=document.getElementById(id);
  s.innerHTML='';
  opts.forEach(o=>{
    let op=document.createElement('option');
    op.value=o[0];
    op.text=o[1];
    s.appendChild(op);
  });
}


/* ✅ 動態限制 + 即時更新 */
function update(){

let v=i=>document.getElementById('S'+i)?.value;

if(mode==0){

    let lengthSelect =
        document.getElementById('S2');

    let tagSelect =
        document.getElementById('S6');

    /* DT3P */
    if(v(0)==='DT3P'){

        if(!dt3pApplied){

            let currentLength =
                lengthSelect.value;

            fill(
                'S2',
                drum[2][1].filter(o =>
                    o[0] === '25' ||
                    o[0] === '29'
                )
            );

            if(
                currentLength === '25' ||
                currentLength === '29'
            ){
                lengthSelect.value =
                    currentLength;
            }

            fill('S6',[
                ['1','No tag']
            ]);

            tagSelect.value = '1';

            dt3pApplied = true;
        }

    }
    else{

        if(dt3pApplied){

            let currentLength =
                lengthSelect.value;

            fill(
                'S2',
                drum[2][1]
            );

            if(currentLength){
                lengthSelect.value =
                    currentLength;
            }

            fill(
                'S6',
                drum[6][1]
            );

            dt3pApplied = false;
        }

    }

}
  /* PN */
  let pn='';

  if(mode==0){
    pn=v(0)+v(1)+'-'+v(2)+'-'+v(3)+'-'+v(4)+v(5)+v(6)+'-'+v(7);
  }else{
    pn=v(0)+'-'+v(1)+'-'+v(2)+'-00-'+v(3)+v(4);
  }

document.getElementById('output').innerText = pn;

let statusEl =
    document.getElementById('status');

/* 檢查是否有未完成選擇 */

let incomplete = false;

if(mode==0){

    for(let i=0;i<drum.length;i++){

        let obj =
            document.getElementById('S'+i);

        if(!obj || obj.value === ''){

            incomplete = true;
            break;

        }

    }

}
else{

    for(let i=0;i<head.length;i++){

        let obj =
            document.getElementById('S'+i);

        if(!obj || obj.value === ''){

            incomplete = true;
            break;

        }

    }

}

/* 先清空 Recommendation */

document.getElementById("headRecommend").innerHTML = '';

if(incomplete){

    statusEl.innerText =
        '⚠ Please complete all selections';

    statusEl.className =
        'status warn';

}
else if(pn.includes('XX')){

    statusEl.innerText =
        '⚠ Contact Entegris required';

    statusEl.className =
        'status warn';

}
else{

    statusEl.innerText =
        '✔ Valid configuration';

    statusEl.className =
        'status valid';

    /* 只有有效配置才顯示推薦 */

    if(mode === 0){

        updateHeadRecommendation();

    }

}
}

/* 事件 */
document.addEventListener('change', update);

function copyPN(){
  let t=document.getElementById('output').innerText;
  navigator.clipboard.writeText(t);
  alert('Copied: '+t);
}

function updateHeadRecommendation(){

    if(mode !== 0){
        return;
    }

    let pipe      = document.getElementById('S0')?.value;
    let ports     = document.getElementById('S1')?.value;
    let keycode   = document.getElementById('S3')?.value;
    let oRingCode = document.getElementById('S5')?.value;

    if(!pipe || !ports || !keycode){

        document.getElementById("headRecommend").innerHTML =
            '';

        return;
    }

let oRingText = '';
  
if(oRingCode === '0'){
    oRingText = 'FEP-encapsulated Silicone';
}
else if(oRingCode === '1'){
    oRingText = 'FEP-encapsulated FKM';
}
else if(oRingCode === '2'){
    oRingText = 'FEP-encapsulated EPDM';
}

    let headPN =
        'DH3' +
        ports +
        '-' +
        keycode +
        '-3-' +
        oRingCode +
        '00';

document.getElementById("headRecommend").innerHTML =
`
<div style="color:black;">

  <div style="font-size:16px;font-weight:600;">
    Recommended Dispense Head
  </div>

  <div style="font-size:20px;font-weight:bold;margin-bottom:10px;">
    ${headPN}
  </div>

<div style="
    font-family:Segoe UI;
    font-size:14px;
    font-weight:400;
    line-height:1.5;
">
  Ports: ${ports}-ports<br>
  Chemical keycode: ${keycode}<br>
  Nut material: PFA<br>
  O-ring material: ${oRingText}<br>
</div>

</div>
`;

}

render();

</script>

</body>
</html>
